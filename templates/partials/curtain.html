{% comment %}
The opening page. Drawn live — no video element, no player.
One P in the DOM: it seats, it throws, the F sets into it.
{% endcomment %}
<div class="curtain" data-curtain hidden aria-label="Paul Frendach">
  <div class="curtain__clock" data-clock></div>
  <div class="curtain__vignette"></div>

  <div class="curtain__stage">
    <div class="curtain__word" data-word>
      <div class="curtain__lockup">
        <span class="curtain__p" data-p>P</span>
        <div class="curtain__aul" data-aul><span>A</span><span>U</span><span>L</span></div>
        <div class="curtain__mark" data-mark>
          <span>F</span><span>R</span><span>E</span><span>N</span><span>D</span><span>A</span><span>C</span><span>H</span>
        </div>
      </div>
    </div>
    <p class="curtain__sub" data-sub>Create · Build · Train</p>
  </div>

  <button class="curtain__skip" type="button" data-skip>Skip</button>
</div>
