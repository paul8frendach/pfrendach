{% load static %}
{% comment %}
Persistent chrome. Centred. The three worlds are the options; About and
Contact are sub-text to them. The signature never changes between rooms.
{% endcomment %}
<header class="chrome" data-chrome>
  <div class="shell chrome__inner">
    <a class="sig" href="{% url 'house:home' %}" aria-label="Paul Frendach — home">
      <img src="{% static 'marks/pf-house.svg' %}" alt="">
      <span>RENDACH</span>
    </a>

    <nav class="tabs" aria-label="Worlds" data-tabs>
      <span class="tabs__marker" data-tab-marker aria-hidden="true"></span>
      {% for world in worlds %}
        <a class="tab tab--{{ world.slug }}"
           href="{{ world.get_absolute_url }}"
           {% if current_world == world.slug %}aria-current="page"{% endif %}>
          {{ world.verb }}<span>{{ world.name }}</span>
        </a>
      {% endfor %}
    </nav>

    <nav class="subnav" aria-label="More">
      <a href="{% url 'house:about' %}"
         {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>About</a>
      <i aria-hidden="true"></i>
      <a href="{% url 'house:contact' %}"
         {% if request.resolver_match.url_name == 'contact' %}aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
